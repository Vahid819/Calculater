<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculator</title>
  </head>
  <body>
    <div id="circal">
      <div id="calculator">
        <div id="result">

        </div>
        <div id="buttons">
            <button>+</button>
            <button>-</button>
            <button>X</button>
            <button>/</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>AC</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>C</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>=</button>
            <button>0</button>
            <button>.</button>
        </div>
      </div>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
